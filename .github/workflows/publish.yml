name: Publish to npm

# Publishes the package when a GitHub release is published. Tests and the build must pass first.
#
# Authentication is npm "trusted publishing" (OpenID Connect): npm trusts this workflow file in this
# repository, configured on npmjs.com under the package's Settings → Trusted Publisher. There is no
# token to store or renew. If you rename this file, update the trusted publisher on npm too.
#
# To release: bump "version" in package.json, commit, then create a GitHub release whose tag is that
# version (e.g. v1.2.0). The workflow refuses to publish if the tag and package.json disagree.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this run came from this repository and workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which supports trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm publish --provenance --access public
